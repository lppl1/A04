<!DOCTYPE html>
<!--this tells the browser that this document uses HTML5-->
<html lang="en"> 
<!--this opens the HTML document and sets English as the language-->

<head> 
<!--this begins the head section, which contains page information-->
    <meta charset="UTF-8"> 
<!--this allows the page to display a wide range of characters-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--this lets the page adjust depending on different screen sizes-->
    <title>My First Web Page</title> 
<!--this sets the page title of the web page-->
</head> 
<!--this tag ends the head section-->

<body> <!--this tag starts the body section which contains the visible webpage content-->

    <header> <!--this tag starts the header section at the top of the webpage-->
        <h1>My First Web Page</h1> 
        <!--the h1 tag shows the main heading of the webpage-->
        <p>Welcome to my first HTML webpage!</p> 
        <!--the p tag displays text/paragraphs and in this case the text underneath the header-->
    </header> 
    <!--this tag ends the header section-->

    <main> 
        <!--the main tag starts the main content section of the webpage-->
        <h2>Student Information</h2> 
        <!--the h2 tag displays the heading info for the student information section-->

        <p><strong>Username:</strong> lppl1</p> 
        <!--this tag shows that the username category is bold and the username follows it (not bolded)-->
        <p><strong>Course Name:</strong> Introduction to Website Development</p> 
        <!--this tag displays the course name in part in bold and the actual course name-->
        <p><strong>Course Number:</strong> IS117</p> 
        <!--this tag displays the text: course number (in bold) and the actual number of the course (not bolded)-->
        <p><strong>Section:</strong> 001</p> 
        <!--this section bolds "section" and displays the actual section number-->

    </main> 
    <!--this tag ends the main content section-->

    <footer> 
        <!--this footer tag starts the footer information at the bottom of the page-->
        <p>&copy; 2026 Luke Puchnowski | Due Date: 10/6/26</p> 
        <!--this specific p tag displays the copyright info, the year, the student, name and the due date-->
    </footer> 
    <!--this tag ends the footer section-->

</body> 
<!--this body tag ends the body section of the webpage-->
</html> 
<!--this tag ends the HTML document-->
