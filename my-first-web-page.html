
<!DOCTYPE html> <!--Tells the browser this document uses HTML5-->
<html lang="en"> <!--Opens the HTML document and specifies English as the language-->

<head> <!--Starts the head section, which contains page information-->
    <meta charset="UTF-8"> <!--Allows the page to display a wide range of characters-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Makes the page adjust to different screen sizes-->
    <title>My First Web Page</title> <!--Sets the title displayed in the browser tab-->
</head> <!--Ends the head section-->

<body> <!-- Starts the body section, which contains the visible webpage content-->

    <header> <!--Starts the head section at the top of the webpage-->
        <h1>My First Web Page</h1> <!--Displays the main heading of the webpage-->
        <p>Welcome to my first HTML webpage!</p> <!-- Displays a short welcome message-->
    </header> <!--Ends the head section-->

    <main> <!--Starts the main content section of the webpage-->
        <h2>Student Information</h2> <!--Displays a heading for the student information-->

        <p><strong>Username:</strong> lppl1</p> <!--Displays the student's username-->
        <p><strong>Course Name:</strong> Introduction to Website Development</p> <!--Displays the course name-->
        <p><strong>Course Number:</strong> IS117</p> <!--Displays the course number-->
        <p><strong>Section:</strong> 001</p> <!--Displays the course section-->

    </main> <!--Ends the main content section.-->

    <footer> <!--Starts the footer section at the bottom of the webpage-->
        <p>&copy; 2026 Luke Puchnowski | Due Date: 10/6/26</p> <!--Displays the copyright symbol, student's name, and assignment due date-->
    </footer> <!--Ends the footer section-->

</body> <!--Ends the body section-->
</html> <!--Ends the HTML document-->
